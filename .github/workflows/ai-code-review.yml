name: AI Code Review (Groq)

on:
  pull_request:
    types: [opened, synchronize]

# Shared review prompt — stored in env so the run: block stays clean
env:
  REVIEW_PROMPT: |
    You are a senior Java code reviewer. Review ONLY Java source file changes in the diff below.
    Ignore YAML, shell scripts, config, or workflow files.

    For each issue mention the exact line number from the diff (e.g. "Line 42:").
    Keep each point to one concise sentence.

    Focus on:
    - Security vulnerabilities (SQL injection, hardcoded credentials, missing auth checks)
    - Bugs (== vs .equals(), NPE risks, integer division, race conditions)
    - Java best practices (use Optional, avoid returning null, use StringBuilder)
    - Performance (inefficient loops, unnecessary object creation)
    - Clean code (magic numbers, poor names, swallowed exceptions)

    Respond ONLY in this format (omit sections with nothing to report):

    ## Critical Issues
    - Line X: issue description

    ## Warnings
    - Line X: issue description

    ## Suggestions
    - Line X: suggestion

    ## Well Done
    - what was done right

    ## Verdict: MERGE or REQUEST CHANGES — one sentence reason.

jobs:

  groq-review:
    name: Groq AI Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      # Filter to Java files only — avoids workflow/config noise filling the buffer
      - name: Get PR diff
        run: |
          git diff \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.head.sha }} \
            -- '*.java' \
            > /tmp/pr_diff.txt
          echo "Diff size: $(wc -c < /tmp/pr_diff.txt) bytes"
          cat /tmp/pr_diff.txt

      - name: Send diff to Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY not set — skipping."
            exit 0
          fi

          DIFF=$(head -c 10000 /tmp/pr_diff.txt)

          if [ -z "$(cat /tmp/pr_diff.txt)" ]; then
            echo "No Java changes found." > /tmp/groq_review.txt
            echo "llama-3.3-70b-versatile" > /tmp/groq_model.txt
            exit 0
          fi

          RESPONSE=$(jq -n \
            --arg model  "llama-3.3-70b-versatile" \
            --arg system "You are a senior Java code reviewer. Be concise and mention line numbers." \
            --arg prompt "$REVIEW_PROMPT" \
            --arg diff   "$DIFF" \
            '{
              model: $model,
              max_tokens: 1500,
              temperature: 0.2,
              messages: [
                { role: "system", content: $system },
                { role: "user",   content: ($prompt + "\n\nDiff:\n```diff\n" + $diff + "\n```") }
              ]
            }' | \
          curl -s -X POST https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -d @-)

          echo "$RESPONSE" | jq -r '.choices[0].message.content // "Groq returned no content."' \
            > /tmp/groq_review.txt
          echo "$RESPONSE" | jq -r '.model // "llama-3.3-70b-versatile"' \
            > /tmp/groq_model.txt

          echo "=== Groq Review ==="
          cat /tmp/groq_review.txt

      # Build comment body into a file — never inline AI output into shell variables
      # (backticks in AI text get executed as commands)
      - name: Post Groq review comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:    ${{ github.event.pull_request.number }}
          REPO:         ${{ github.repository }}
        run: |
          if [ ! -f /tmp/groq_review.txt ]; then
            echo "No review file — skipping comment."
            exit 0
          fi

          MODEL=$(cat /tmp/groq_model.txt 2>/dev/null || echo "llama-3.3-70b-versatile")

          {
            echo "## Groq AI Code Review"
            echo "Powered by Groq \`$MODEL\`"
            echo ""
            cat /tmp/groq_review.txt
          } > /tmp/groq_comment.txt

          jq -Rs '{ body: . }' /tmp/groq_comment.txt | \
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d @-

          echo "Review posted to PR #$PR_NUMBER"
