name: AI Code Review (Groq)

on:
  pull_request:
    types: [opened, synchronize]

jobs:

  # ── Groq AI Review ───────────────────────────────────────────────────────────
  # Triggered on every PR open/update. Checks GROQ_API_KEY inside the step.
  # NOTE: never use "if: secrets.X != ''" at job level — secrets context is
  # unavailable in job-level conditions and always evaluates to false.
  groq-review:
    name: Groq AI Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      # Get only Java file changes — avoids workflow/config noise filling the buffer
      - name: Get PR diff (Java files only)
        run: |
          git diff \
            ${{ github.event.pull_request.base.sha }} \
            ${{ github.event.pull_request.head.sha }} \
            -- '*.java' \
            > /tmp/pr_diff.txt
          echo "Diff size: $(wc -c < /tmp/pr_diff.txt) bytes"
          cat /tmp/pr_diff.txt

      - name: Send diff to Groq
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY not set — skipping review."
            exit 0
          fi

          DIFF=$(head -c 10000 /tmp/pr_diff.txt)

          if [ -z "$DIFF" ]; then
            echo "No Java file changes found — skipping review."
            echo "No Java source file changes were found in this PR." > /tmp/groq_review.txt
            echo "llama-3.3-70b-versatile" > /tmp/groq_model.txt
            exit 0
          fi

          PROMPT='You are a senior Java code reviewer. Review the following git diff and provide structured feedback.

Analyse the changes for:
1. Bugs & Logic Errors – NullPointerExceptions, == vs .equals(), integer division, unchecked casts.
2. Java Best Practices – Optional, Collections, generics, access modifiers, immutability.
3. Maven / Build Issues – missing dependency scopes, missing plugin version pins.
4. Performance Problems – String concatenation in loops, unnecessary object creation.
5. Security Vulnerabilities – SQL injection, hardcoded credentials, missing input validation.
6. Clean Code Violations – magic numbers, poor naming, dead code, missing Javadoc on public API.

For each issue mention the exact line number from the diff (e.g. "Line 42:").

Format your response EXACTLY as follows:

## Critical Issues
Bugs or security vulnerabilities that MUST be fixed before merge.

## Warnings
Bad practices and code smells that should be fixed.

## Suggestions
Optional improvements and enhancements.

## Well Done
Anything done correctly or following good practices.

## Verdict
One-sentence overall assessment ending with MERGE or REQUEST CHANGES.'

          RESPONSE=$(jq -n \
            --arg model  "llama-3.3-70b-versatile" \
            --arg system "You are a senior Java code reviewer. Be specific, concise, and mention line numbers." \
            --arg prompt "$PROMPT" \
            --arg diff   "$DIFF" \
            '{
              model: $model,
              max_tokens: 1500,
              temperature: 0.2,
              messages: [
                { role: "system", content: $system },
                { role: "user",   content: ($prompt + "\n\nDiff:\n```diff\n" + $diff + "\n```") }
              ]
            }' | \
          curl -s -X POST https://api.groq.com/openai/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -d @-)

          # Write to files — never store AI output in shell variables for injection into scripts
          echo "$RESPONSE" | jq -r '.choices[0].message.content // "Groq returned no content."' \
            > /tmp/groq_review.txt
          echo "$RESPONSE" | jq -r '.model // "llama-3.3-70b-versatile"' \
            > /tmp/groq_model.txt

          echo "=== Groq Review ==="
          cat /tmp/groq_review.txt

      # IMPORTANT: build the comment body into a file and use jq -Rs to encode it.
      # Never inline AI output into a shell variable — backticks get executed as commands.
      - name: Post Groq review comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER:    ${{ github.event.pull_request.number }}
          REPO:         ${{ github.repository }}
        run: |
          if [ ! -f /tmp/groq_review.txt ]; then
            echo "No review file — skipping comment."
            exit 0
          fi

          MODEL=$(cat /tmp/groq_model.txt 2>/dev/null || echo "llama-3.3-70b-versatile")

          {
            echo "## Groq AI Code Review"
            echo "Powered by Groq \`$MODEL\`"
            echo ""
            cat /tmp/groq_review.txt
          } > /tmp/groq_comment.txt

          # jq -Rs safely JSON-encodes the whole file including backticks and quotes
          jq -Rs '{ body: . }' /tmp/groq_comment.txt | \
          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
            -d @-

          echo "Review posted to PR #$PR_NUMBER"
